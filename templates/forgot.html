
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
     <link rel="stylesheet"  href="{{ url_for('static',filename='bootstrap.min.css')}}">
    <script src="{{ url_for('static', filename='validation.js') }}"></script>
    <style>
        body {
            background: linear-gradient(to bottom, #ff00ff 0%, #0066ff 100%);
        }
        .forgot-password-container {
            max-width: 400px;
            margin: 100px auto;
            padding: 25px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.9
            );
            margin-top:100px;
            margin-bottom:100px;
        }
        .container{
			margin-top:198px;
            margin-bottom:195px;
        }
        span{
        color: hotpink;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="forgot-password-container">
        <h2 class="text-center">Forgot Password</h2><br>

        <form action="{{ url_for('forgot') }}" method="post">
            <div class="mb-4">
                <label>Email Address
                	<span>*</span>
                </label>
                <input type="email" class="form-control" name="uemail"  placeholder="Enter your email" required >
            </div>
            <div class="mb-3">
                <label>New Password
                    <span>*</span>
                </label>
                <input type="password" class="form-control" name="unewpass" placeholder="Enter your New Password" required >
            </div>
            <br>
            <button type="submit" class="btn btn-primary w-100" style="background:linear-gradient(to bottom right, #0099ff 0%, #ff00ff 100% ";>Change Password</button>
        </form>
    </div>
</div>



</body>
</html>
