<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Sanket's Computers & Sales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #232F3E 0%, #37475a 100%);
            min-height: 100vh;
        }
        .register-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        .btn-primary-custom {
            background: #FF9900;
            color: #232F3E;
            border: none;
            font-weight: 600;
        }
        .btn-primary-custom:hover {
            background: #FEBD3D;
            color: #232F3E;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="register-card p-4">
                    <div class="text-center mb-4">
                        <h3><i class="fas fa-laptop text-primary"></i> Sanket's Computers</h3>
                        <p class="text-muted">Create your account</p>
                    </div>

                    <form method="POST" action="{{ url_for('usersign') }}">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label>Full Name</label>
                                <input type="text" name="u_fname" class="form-control" placeholder="Enter your name" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Email Address</label>
                                <input type="email" name="u_email" class="form-control" placeholder="Enter your email" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Phone Number</label>
                                <input type="tel" name="u_num" class="form-control" placeholder="Enter phone number" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label>Password</label>
                                <input type="password" name="u_pass" class="form-control" placeholder="Create password" required>
                            </div>
                            <div class="col-md-12 mb-3">
                                <label>Confirm Password</label>
                                <input type="password" name="u_confirm" class="form-control" placeholder="Confirm password" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary-custom w-100 py-2">Register</button>
                    </form>

                    <div class="text-center mt-4">
                        <p>Already have an account? <a href="{{ url_for('userlog') }}">Login</a></p>
                    </div>

                    <hr>
                    <div class="text-center">
                        <a href="{{ url_for('home') }}" class="btn btn-outline-secondary w-100">
                            <i class="fas fa-home"></i> Back to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
