{% extends "main.html" %}
{% block body %}

<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Booking Form</title>
	<link rel="stylesheet" href="{{ url_for('static',filename='bootstrap.min.css')}}">
	<script src="{{ url_for('static',filename='validation.js')}}"></script>

	<style type="text/css">
		.container {
			margin-top: 43px;
			margin-bottom: 35px;
		}
		.A {
			background-image: url(static/image/op.jpg);
			border-top-left-radius: 15px;
			border-bottom-left-radius: 15px;
			padding: 15px;
			background-size: cover;
			box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.9), 0 8px 20px 0 rgba(0, 0, 0, 0.39);
		}
		.B {
			padding: 30px;
			background-color: white;
			border-top-right-radius: 15px;
			border-bottom-right-radius: 15px;
			box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.9), 0 8px 20px 0 rgba(0, 0, 0, 0.39);
		}
		body {
			background: linear-gradient(to bottom, #ff00ff 0%, #0066ff 100%);
		}
		span {
			color: hotpink;
		}
	</style>
	<script>
		function calculateTotal() {
			// Get the price and quantity values
			const price = parseFloat(document.getElementById('price').value.replace(/[^0-9.-]+/g,"")); // Remove currency symbol
			const quantity = parseInt(document.getElementById('quantity').value) || 0; // Default to 0 if NaN
			const totalAmount = price * quantity; // Calculate total amount
			document.getElementById('totalAmount').value = totalAmount.toFixed(2); // Update total amount field
		}
	</script>
</head>
<body>
<form action="{{ url_for('booking')}}" method="POST">
<div class="container">
	<div class="row">
		<div class="col-sm-1"></div>
		<div class="col-sm-10">
			<div class="row">
				<div class="col-sm-6 A"></div>
				<div class="col-sm-6 B">
					<h2 class="text-center mb-4">Booking</h2>
					<br>

					<label>Name<span>*</span></label>
					<div class="col-sm-12">
						<input type="text" placeholder="Enter Your Full Name" name="bfull_name" class="form-control" value="{{session['unm']}}" onkeypress="javascript: return isString(event)" required>
					</div><br>

					<label>Email-Address<span>*</span></label>
					<div class="col-sm-12">
						<input type="email" name="bemail" class="form-control" value="{{session['uadd']}}" placeholder="Enter Your Email Address" required>
					</div><br>

					<div class="row">
						<div class="col-sm-6">
							<label>Contact Number<span>*</span></label>
							<input type="text" class="form-control" value="{{session['unum']}}" placeholder="Enter Your Number" name="bcontact" required>
						</div>
						<div class="col-sm-6">
							<label>Product<span>*</span></label>
							<input type="text" class="form-control" value="{{session['pbr']}}, {{session['pdes']}}" placeholder="Enter Your Product" name="bselect" required>
						</div>
					</div>
					<br>

					<div class="row">
						<div class="col-sm-6">

							<label>Price<span>*</span></label>
							<input type="text" class="form-control" value="&#8377;{{session['ppr']}}" placeholder="Enter Your Product" name="bprice" id="price" readonly>
						</div>
						<div class="col-sm-6">
							<label>Quantity<span>*</span></label>
							<input type="number" class="form-control" placeholder="Enter Your Quantity" name="bquan" id="quantity" required oninput="calculateTotal()">
						</div>
					</div>
					<br>

					<div class="col-sm-12">
						<label>Total Amount<span>*</span></label>
						<input type="number" class="form-control" name="bam" placeholder="Total Amount" id="totalAmount" readonly>
					</div>
					<br>

					<div class="row">
						<div class="col-sm-12">
							<input type="submit" value="Submit Booking" class="btn btn-success form-control" style="background:linear-gradient(to bottom right, #0099ff 0%, #ff00ff 100%);">
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="col-sm-1"></div>
	</div>
</div>
</form>

</body>
</html>
{% endblock %}
