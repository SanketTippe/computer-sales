{% extends 'dash.html' %}
{% block body %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product List</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='bootstrap.min.css')}}">
	<script src="{{ url_for('static',filename='validation.js')}}"></script>
    <style>
        .container
        {
        border:solid;
        padding:20px;
        margin-top:50px;
        }

    </style>
</head>
<body>
<form>
<div class="container">
   <h2 align="center">Product List</h2>
    <br>
    <table class="table">
  <thead>
    <tr>
      <th scope="col"></th>
      <th scope="col">Product Name</th>
      <th scope="col">Brand</th>
         <th scope="col">Price</th>
         <th scope="col">Quantities</th>
           <th scope="col">Description</th>
          <th scope="col">Category</th>
          <th scope="col">Product Image</th>
        <th scope="col">Update</th>
        <th scope="col">Delete</th>
    </tr>
  </thead>
  <tbody>
  {% for row in value %}
    <tr>
        <form action="{{ url_for('update_product') }}" method="post">
      <th scope="row"></th>
            <input type="hidden" name="p_id" value="{{ row[0] }}">
      <td><input type="text" name="product_nm" value="{{ row[1] }}" class="form-control" placeholder="Enter Product Name"> </td>
        <td><input type="text" name="product_br" value="{{ row[2] }}" class="form-control" placeholder="Enter Brand"> </td>
        <td><input type="text" name="product_price" value="{{ row[3] }}" class="form-control" placeholder="Enter Price"> </td>
             <td><input type="text" name="product_quan" value="{{ row[4] }}" class="form-control" placeholder="Enter Quantities"> </td>
              <td><input type="text" name="product_desc" value="{{ row[5] }}" class="form-control" placeholder="Enter Description"> </td>
             <td><input type="text" name="product_cat" value="{{ row[6] }}" class="form-control" placeholder="Enter Category"> </td>
             <td><input type="file" name="product_img" value="{{ row[7] }}" class="form-control" placeholder="Enter Product Image"> </td>


        <td><input type="submit" name="" class="btn btn-success" value="Update"></td>
            </form>
        <form action="{{ url_for('delete_product') }}" method="POST">
        <input type="hidden" name="p_id" value="{{row[0]}}">
        <td><input type="submit" name="" class="btn btn-danger" value="Delete"></td>
            </form>
    </tr>
    </tr>
  {% endfor %}
  </tbody>
</table>
</div>
</body>
</html>
{% endblock %}
