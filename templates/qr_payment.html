<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Payment - Sanket's Computers & Sales</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #232F3E 0%, #37475a 100%);
            min-height: 100vh;
        }
        .qr-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="qr-card p-5">
                    <h3><i class="fas fa-qrcode text-primary"></i> UPI QR Payment</h3>
                    <p class="text-muted">Scan the QR code to pay Rs. {{ amount }}</p>

                    <div class="my-4">
                        <img src="data:image/png;base64,{{ qr_image }}" class="img-fluid" style="max-width:250px;" alt="QR Code">
                    </div>

                    <div class="alert alert-info">
                        <i class="fas fa-info-circle"></i>
                        <strong>UPI ID:</strong> {{ upi_id }}
                    </div>

                    <p class="text-muted">Scan with any UPI app (Google Pay, PhonePe, Paytm, etc.)</p>

                    <div class="countdown mb-4">
                        <p>Payment expires in: <span id="timer">05:00</span></p>
                    </div>

                    <form action="{{ url_for('qr_payment_complete') }}" method="GET">
                        <button type="submit" class="btn btn-success btn-lg w-100">
                            <i class="fas fa-check-circle"></i> I've Made the Payment
                        </button>
                    </form>

                    <div class="mt-3">
                        <a href="{{ url_for('payment_method') }}" class="btn btn-outline-secondary">
                            <i class="fas fa-arrow-left"></i> Back
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 5-minute countdown timer
        let timeLeft = 300;
        const timerEl = document.getElementById('timer');

        const timer = setInterval(() => {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timerEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;

            if (timeLeft <= 0) {
                clearInterval(timer);
                alert('Payment time expired! Please try again.');
                window.location.href = '{{ url_for("payment_method") }}';
            }
            timeLeft--;
        }, 1000);
    </script>
</body>
</html>
