{% extends "base.html" %}

{% block title %}Products - Sanket's Computers & Sales{% endblock %}

{% block content %}
<div class="container py-5">
    <h2 class="section-title">Our Products</h2>

    <div class="row mb-4">
        <div class="col-md-12">
            <form method="GET" action="{{ url_for('view_product') }}" class="row g-3">
                <div class="col-md-3">
                    <input type="text" name="search" class="form-control" placeholder="Search products..." value="{{ request.args.get('search', '') }}">
                </div>
                <div class="col-md-2">
                    <select name="brand" class="form-select">
                        <option value="">All Brands</option>
                        {% for brand in value %}
                        <option value="{{ brand[2] }}">{{ brand[2] }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="number" name="min_price" class="form-control" placeholder="Min Price">
                </div>
                <div class="col-md-2">
                    <input type="number" name="max_price" class="form-control" placeholder="Max Price">
                </div>
                <div class="col-md-2">
                    <select name="sort" class="form-select">
                        <option value="newest">Newest First</option>
                        <option value="price_low">Price: Low to High</option>
                        <option value="price_high">Price: High to Low</option>
                        <option value="rating">Top Rated</option>
                    </select>
                </div>
                <div class="col-md-1">
                    <button type="submit" class="btn btn-primary w-100"><i class="fas fa-filter"></i></button>
                </div>
            </form>
        </div>
    </div>

    <div class="row">
        {% for category in value %}
        <div class="col-md-3 col-6 mb-4">
            <form method="POST" action="{{ url_for('view') }}">
                <input type="hidden" name="mnm" value="{{ category[0] }}">
                <button type="submit" style="background:none; border:none; width:100%; cursor:pointer;">
                    <div class="product-card text-center">
                        <img src="{{ url_for('static', filename=category[2]) }}" class="img-fluid mb-3" style="height:150px; object-fit:contain;" alt="{{ category[1] }}">
                        <h5>{{ category[1] }}</h5>
                        <p class="text-muted small">{{ category[3][:100] if category[3] else '' }}</p>
                    </div>
                </button>
            </form>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
