{% extends "main.html" %}
{% block body %}
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Feedback</title>
	<link rel="stylesheet" href="{{ url_for('static',filename='bootstrap.min.css')}}">
	<script src="{{ url_for('static',filename='validation.js')}}"></script>
	<style type="text/css">
		.container{
			margin-top: 47px;
            margin-bottom:45px;

		}
		.A{
			background-image:url(static/image/feedback.jpg);
			border-top-left-radius:15px;
			border-bottom-left-radius:15px;
			padding:px;
		    background-size: cover;
		    box-shadow:0 4px 8px 0 rgba(0, 0, 0, 0.9),0 8px 20px 0 rgba(0, 0, 0, 0.39);
		}
		.B{
			padding:30px;
			background-color: white;
			border-top-right-radius:15px;
			border-bottom-right-radius:15px;
			box-shadow:0 4px 8px 0 rgba(0, 0, 0, 0.9),0 8px 20px 0 rgba(0, 0, 0, 0.39);
		}
		body{
         background: linear-gradient(to bottom, #ff00ff 0%, #0066ff 100%);
		}

		span{
		color: hotpink;
		}


	</style>
</head>
<body>

<form action="{{ url_for('feedback')}}" method="POST">
<div class="container">
	<div class="row">
		<div class="col-sm-1">

		</div>
		<div class="col-sm-10">
			<div class="row">
				<div class="col-sm-6 A">
				</div>
				<div class="col-sm-6 B">
					  <h2 class="text-center mb-4">Feedback</h2>
					<br>
					  <div class="col-sm-12">
                    <div class="form-group">
                        <label>Full Name <span>*</span></label>
                        <input type="text" class="form-control" id="name" name="feed_name" placeholder="Your Name"  onkeypress="javascript: return isString(event)" required>
                    </div>
                </div>
					<br>
					<div class="col-sm-12">
                    <div class="form-group">
                        <label>Email Address <span>*</span></label>
                        <input type="email" class="form-control" id="email" name="feed_email" placeholder="Your Email" required>
                    </div>
                </div>
                <br>
					<div class="form-group">
                <label>Rating <span>*</span></label>
                <select id="rating" name="feed_rating" class="form-select" required>
                    <option value="excellent">Excellent</option>
                    <option value="good">Good</option>
                    <option value="average">Average</option>
                    <option value="poor">Poor</option>
                </select>
            </div>
					<br>
						<div class="form-group">
                <label>Your Feedback <span>*</span></label>
                <textarea id="feedback" name="feed_yourfeed" rows="4" class="form-control" placeholder="Your Comments"  onkeypress="javascript: return isAlphanumric(event)" required></textarea>
            </div>
					<br>
					<div class="row">
			<div class="col-sm-12">
				<input  type="Submit" value="Submit Feedback" class="btn btn-primary form-control" name="" style="background:linear-gradient(to bottom right, #0099ff 0%, #ff00ff 100% ";>
			</div>
					</div>
				</div>
				<div class="col-sm-1"></div>

	</div>
</div>
</form>
</body>
</html>
{% endblock %}
